name: Analyse MAVEN NGIMS operational phases — TID 14282
on:
  push:
    branches: [stage-3-planetary-physics]
    paths:
      - 'scripts/science/analyse-maven-ngims-l1b-operational-phases-tid-14282.py'
      - '.github/workflows/analyse-maven-ngims-l1b-operational-phases-tid-14282.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  analyse:
    if: contains(github.event.head_commit.message, '[analyze-ngims-l1b-operational-phases-14282]') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage-3-planetary-physics
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and run offline self-test
        run: |
          python -m py_compile scripts/science/analyse-maven-ngims-l1b-operational-phases-tid-14282.py
          python scripts/science/analyse-maven-ngims-l1b-operational-phases-tid-14282.py --self-test
      - name: Analyze frozen TID 14282 evidence
        run: python scripts/science/analyse-maven-ngims-l1b-operational-phases-tid-14282.py
      - name: Commit generated diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/Data/mavenNgimsL1bHousekeepingArchive/operational-phase-diagnostics.json
          if ! git diff --cached --quiet; then
            git commit -m "data(science): index NGIMS operational phase diagnostics [skip ci]"
            git push
          fi
