name: Audit official MAVEN NGIMS L2/L3 product indexes

on:
  push:
    branches: [stage-3-planetary-physics]

jobs:
  audit:
    if: contains(github.event.head_commit.message, '[audit-ngims-product-indexes]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage-3-planetary-physics
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate exact product-index parser
        run: |
          python -m py_compile scripts/science/audit-ngims-product-indexes.py
          python scripts/science/audit-ngims-product-indexes.py --self-test
      - name: Download official L2/L3 selection indexes and exact-join event keys
        run: python scripts/science/audit-ngims-product-indexes.py
      - name: Commit product-index evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/Data/mavenNgimsIndexBundleAudit/product-index-audit.json
          if git diff --cached --quiet; then
            echo "Product-index audit is unchanged."
          else
            git commit -m "data(science): freeze exact NGIMS L2/L3 product-index join [skip ci]"
            git fetch origin stage-3-planetary-physics
            git rebase origin/stage-3-planetary-physics
            git push origin HEAD:stage-3-planetary-physics
          fi
