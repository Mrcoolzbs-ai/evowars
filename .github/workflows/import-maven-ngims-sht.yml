name: Import MAVEN NGIMS L3 scale-height temperature TID 14282

on:
  push:
    branches: [stage-3-planetary-physics]

concurrency:
  group: ngims-sht-tid-14282-${{ github.ref }}
  cancel-in-progress: false

jobs:
  retrieve:
    if: contains(github.event.head_commit.message, '[import-ngims-sht-tid-14282]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout science branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: stage-3-planetary-physics

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Retrieve exact same-TID scale-height product
        run: python scripts/science/retrieve-maven-ngims-sht-tid-14282.py

      - name: Commit frozen scale-height product and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/Data/mavenNgimsShtArchive/
          if git diff --cached --quiet; then
            echo "No new scale-height source files to freeze."
          else
            git commit -m "data(science): freeze MAVEN NGIMS L3 SHT TID 14282 [skip ci]"
            git fetch origin stage-3-planetary-physics
            git pull --rebase origin stage-3-planetary-physics
            git push origin HEAD:stage-3-planetary-physics
          fi
