# Rust/WASM Pilot CI (Stage H + Stage I)
#
# Отдельный минимальный workflow: НЕ изменяет существующие CI.
# Основной ci.yml по-прежнему запускает прежние проверки; parity-тесты
# RustSim самопропускаются там (pkg-node не собирается в основном CI).
#
# Полный конвейен пилота:
# - cargo test --locked + release build (native);
# - WASM-сборка (pkg-node + pkg-web, wasm-bindgen-cli = версия крейта);
# - tsc, oxlint, vitest (включая Rust/WASM parity Stage H и Stage I),
#   production build;
# - Stage H benchmark (npm run benchmark:rust) — immutable baseline;
# - Stage I prepared-kinetics benchmark (npm run benchmark:prepared):
#   TS native vs preparedTS vs WASM-сессия (Node) + notices;
# - Stage I браузерный benchmark (npm run benchmark:browser):
#   Chromium headless через CDP, Worker + heartbeat + transfer + notices;
# - артефакты всех прогонов + Step Summary.
#
# Cargo.lock: генерируется cargo и коммитится ботом github-actions[bot]
# (локально крейт не собирается). Шаг идемпотентен: если файл уже
# актуален, коммита не будет, поэтому повторные запуски не зацикливаются.

name: rust-wasm-pilot

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main
    paths:
      - "rust/**"
      - "src/modules/RustSim/**"
      - "src/modules/Tests/rustWasmParity.test.ts"
      - "src/modules/Tests/rustPreparedKineticsParity.test.ts"
      - "src/modules/Core/kinetics.ts"
      - "src/modules/Core/reactionLedger.ts"
      - "scripts/wasm/**"
      - "scripts/benchmarks/**"
      - "scripts/bench-browser/**"
      - "rust/bench-web/**"
      - ".github/workflows/rust-wasm-pilot.yml"

permissions:
  contents: write

jobs:
  rust-wasm-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/evowars-sim-core

      - name: Cargo.lock (generate-lockfile)
        run: cargo generate-lockfile --manifest-path rust/evowars-sim-core/Cargo.toml

      - name: Commit Cargo.lock (только push-события)
        if: github.event_name == 'push'
        run: |
          # Cargo.lock может быть новым (untracked) или изменённым:
          # сначала add, затем сравниваем с индексом, а не с рабочим деревом.
          git add rust/evowars-sim-core/Cargo.lock
          if git diff --cached --quiet; then
            echo "Cargo.lock актуален, коммит не нужен."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(rust): обновить Cargo.lock [rust-wasm-pilot CI]"
            if git push; then
              echo "Cargo.lock закоммичен."
            else
              echo "::warning title=Cargo.lock push::push не удался (remote сместился); файл остался локальным для этого запуска, следующий прогон закоммитит его."
            fi
          fi

      - name: cargo test --locked
        run: |
          set +e
          cargo test --locked --manifest-path rust/evowars-sim-core/Cargo.toml > /tmp/step.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            msg=$(tail -c 6000 /tmp/step.log | tr -d '\r' | sed -z -e 's/%/%25/g' -e 's/\n/%0A/g')
            echo "::error title=cargo-test-failed rc=$rc::${msg:0:6000}"
          fi
          exit $rc

      - name: cargo release build (native bench)
        run: |
          set +e
          cargo build --release --manifest-path rust/evowars-sim-core/Cargo.toml > /tmp/step.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            msg=$(tail -c 6000 /tmp/step.log | tr -d '\r' | sed -z -e 's/%/%25/g' -e 's/\n/%0A/g')
            echo "::error title=cargo-release-build-failed rc=$rc::${msg:0:6000}"
          fi
          exit $rc

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: npm ci
        run: npm ci

      - name: Install wasm-bindgen-cli 0.2.95
        run: cargo install wasm-bindgen-cli --version 0.2.95 --locked

      - name: Build WASM (pkg-node + pkg-web)
        run: |
          set +e
          npm run wasm:build > /tmp/step.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            msg=$(tail -c 6000 /tmp/step.log | tr -d '\r' | sed -z -e 's/%/%25/g' -e 's/\n/%0A/g')
            echo "::error title=wasm-build-failed rc=$rc::${msg:0:6000}"
          fi
          exit $rc

      - name: "Debug: форма glue-модуля pkg-node"
        run: |
          echo "--- ключевые строки pkg-node/evowars_sim_core.js ---"
          grep -nE 'module\.exports|__wbg_init|^exports\.|exports\.default' \
            rust/evowars-sim-core/pkg-node/evowars_sim_core.js | head -40 || true

      - name: TypeScript check (tsc -b)
        run: npx tsc -b

      - name: Lint (oxlint)
        run: npm run lint

      - name: Vitest (включая Rust/WASM parity)
        run: |
          set +e
          npx vitest run > /tmp/step.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            msg=$(tail -c 6000 /tmp/step.log | tr -d '\r' | sed -z -e 's/%/%25/g' -e 's/\n/%0A/g')
            echo "::error title=vitest-failed rc=$rc::${msg:0:6000}"
          fi
          exit $rc

      - name: Production build
        run: npm run build

      - name: Benchmark (npm run benchmark:rust)
        run: |
          set +e
          npm run benchmark:rust > /tmp/step.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            msg=$(tail -c 6000 /tmp/step.log | tr -d '\r' | sed -z -e 's/%/%25/g' -e 's/\n/%0A/g')
            echo "::error title=benchmark-failed rc=$rc::${msg:0:6000}"
          fi
          exit $rc

      - name: Benchmark notices
        run: |
          REPORT=benchmark-artifacts/rust-wasm-pilot-report.json
          echo "WASM init: $(jq -r '.meta.wasmInitMs' "$REPORT") мс" \
            | while IFS= read -r line; do echo "::notice title=rust-wasm-benchmark::$line"; done
          jq -r '
            del(.meta) | to_entries[] | .key as $scenario | .value | to_entries[] |
            if (.value.skippedReason != null) then
              "\($scenario) \(.key) ops: пропущено — \(.value.skippedReason)"
            elif (.value.tsNative == null) then
              "\($scenario) \(.key) ops: нет данных"
            else
              "\($scenario) \(.key) ops: ts=\(.value.tsNative.medianMs) ms, " +
              "wasmE2E=\(.value.wasmEndToEnd.medianMs) ms, " +
              "kernel=\(.value.wasmKernelOnly.medianMs) ms, " +
              "native=\(if .value.nativeRust == null then "н/д" else (.value.nativeRust.medianMs|tostring) end) ms, " +
              "speedupE2E=\(if .value.speedupEndToEnd == null then "н/д" else (.value.speedupEndToEnd|tostring) end), " +
              "speedupKernel=\(if .value.speedupKernelOnly == null then "н/д" else (.value.speedupKernelOnly|tostring) end)"
            end
          ' "$REPORT" | while IFS= read -r line; do echo "::notice title=rust-wasm-benchmark::$line"; done

      - name: Stage I prepared-kinetics benchmark (npm run benchmark:prepared)
        run: |
          set +e
          npm run benchmark:prepared > /tmp/step.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            msg=$(tail -c 6000 /tmp/step.log | tr -d '\r' | sed -z -e 's/%/%25/g' -e 's/\n/%0A/g')
            echo "::error title=stage-i-prepared-benchmark-failed rc=$rc::${msg:0:6000}"
          fi
          exit $rc

      - name: Stage I notices (Node)
        run: |
          REPORT=benchmark-artifacts/prepared-kinetics-report.json
          echo "WASM init: $(jq -r '.meta.wasmInitMs' "$REPORT") мс" \
            | while IFS= read -r line; do echo "::notice title=stage-i-prepared::$line"; done
          jq -r '
            .loads | to_entries[] | .value |
            if (.skippedReason != null) then
              "prepared \(.ops) ops: пропущено — \(.skippedReason)"
            elif (.wasmSession == null) then
              "prepared \(.ops) ops: нет данных"
            else
              "prepared \(.ops) ops: prepTs=\(.prepTs.medianMs) ms, " +
              "prepSession=\(.prepSession.medianMs) ms, " +
              "tickPreparedTs=\(.preparedTs.medianMs) ms, " +
              "tickSession=\(.wasmSession.medianMs) ms, " +
              "speedup=\(.speedupSessionVsPreparedTs), " +
              "breakEvenTicks=\(if .breakEvenTicks == null then "недостижим" else (.breakEvenTicks|tostring) end)"
            end
          ' "$REPORT" | while IFS= read -r line; do echo "::notice title=stage-i-prepared::$line"; done
          jq -r '
            "prepared verdict: speedup1e5=\(.verdict.speedupSessionVsPreparedTs100k // "н/д"), " +
            "speedup1e6=\(.verdict.speedupSessionVsPreparedTs1m // "н/д"), " +
            "nodeMeetsThreshold1_5x=\(.verdict.nodeMeetsThreshold1_5x // "н/д")"
          ' "$REPORT" | while IFS= read -r line; do echo "::notice title=stage-i-prepared::$line"; done

      - name: Stage I browser benchmark (Chromium headless, npm run benchmark:browser)
        run: |
          set +e
          npm run benchmark:browser > /tmp/step.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            msg=$(tail -c 6000 /tmp/step.log | tr -d '\r' | sed -z -e 's/%/%25/g' -e 's/\n/%0A/g')
            echo "::error title=stage-i-browser-failed rc=$rc::${msg:0:6000}"
          fi
          exit $rc

      - name: Stage I browser notices
        if: hashFiles('benchmark-artifacts/stage-i-browser-report.json') != ''
        run: |
          REPORT=benchmark-artifacts/stage-i-browser-report.json
          jq -r '"browser chrome: \(.meta.chrome), WASM init в воркере: \(.result.worker.meta.wasmInitMs) мс"' "$REPORT" \
            | while IFS= read -r line; do echo "::notice title=stage-i-browser::$line"; done
          jq -r '
            .result.worker.loads | to_entries[] | .value |
            "browser \(.ops) ops: tickPreparedTs=\(.tickPreparedTs.medianMs) ms, " +
            "tickSession=\(.tickSession.medianMs) ms, " +
            "speedup=\(.speedupSessionVsPreparedTs), " +
            "breakEvenTicks=\(if .breakEvenTicks == null then "недостижим" else (.breakEvenTicks|tostring) end)"
          ' "$REPORT" | while IFS= read -r line; do echo "::notice title=stage-i-browser::$line"; done
          jq -r '
            "browser verdict: speedup1e5=\(.result.worker.verdict.speedupSessionVsPreparedTs100k // "н/д"), " +
            "speedup1e6=\(.result.worker.verdict.speedupSessionVsPreparedTs1m // "н/д"), " +
            "browserMeetsThreshold1_5x=\(.result.worker.verdict.browserMeetsThreshold1_5x // "н/д")"
          ' "$REPORT" | while IFS= read -r line; do echo "::notice title=stage-i-browser::$line"; done
          jq -r '
            .result | "browser heartbeat: Worker-фазы max gap=\([.heartbeat.maxGapByPhase | to_entries[] | select(.key != "mainThreadContrast" and .key != "startup") | .value] | max // 0) мс, " +
            "main-thread блокирующие тики max gap=\(.heartbeat.maxGapByPhase.mainThreadContrast // 0) мс, " +
            "контраст totalMs=\(.mainThreadContrast.totalMs)"
          ' "$REPORT" | while IFS= read -r line; do echo "::notice title=stage-i-browser::$line"; done

      - name: Step Summary
        run: |
          {
            echo "# Rust/WASM Pilot — сводка benchmark (Stage H baseline)"
            cat benchmark-artifacts/rust-wasm-pilot-summary.md
            echo ""
            echo "# Stage I — Prepared Kinetics Session (Node)"
            cat benchmark-artifacts/prepared-kinetics-summary.md
            if [ -f benchmark-artifacts/stage-i-browser-summary.md ]; then
              echo ""
              echo "# Stage I — Prepared Kinetics Session (браузер, Chromium headless)"
              cat benchmark-artifacts/stage-i-browser-summary.md
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        # always(): даже при падении браузерного шага Node-отчёты
        # Stage H/Stage I попадают в артефакты для диагностики.
        if: always()
        with:
          name: benchmark-artifacts
          path: |
            benchmark-artifacts/rust-wasm-pilot-report.json
            benchmark-artifacts/rust-wasm-pilot-summary.md
            benchmark-artifacts/prepared-kinetics-report.json
            benchmark-artifacts/prepared-kinetics-summary.md
            benchmark-artifacts/stage-i-browser-report.json
            benchmark-artifacts/stage-i-browser-summary.md
          if-no-files-found: warn
