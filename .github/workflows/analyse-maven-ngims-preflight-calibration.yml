name: Analyse MAVEN NGIMS pre-flight calibration evidence
on:
  push:
    branches: [stage-3-planetary-physics]
    paths:
      - 'scripts/science/analyse-maven-ngims-preflight-calibration.py'
      - '.github/workflows/analyse-maven-ngims-preflight-calibration.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  analyse:
    timeout-minutes: 90
    if: contains(github.event.head_commit.message, '[analyze-ngims-preflight-calibration]') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage-3-planetary-physics
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and run offline parser tests
        run: |
          python -m py_compile scripts/science/analyse-maven-ngims-preflight-calibration.py
          python scripts/science/analyse-maven-ngims-preflight-calibration.py --self-test
      - name: Retrieve and audit selected raw pre-flight calibration products
        run: python scripts/science/analyse-maven-ngims-preflight-calibration.py
      - name: Upload generated calibration audit
        uses: actions/upload-artifact@v4
        with:
          name: ngims-preflight-calibration-audit
          path: |
            src/modules/Data/mavenNgimsL1bCalibrationArchive/preflight-calibration-products.json
            src/modules/Data/mavenNgimsL1bCalibrationArchive/preflight-calibration-housekeeping-summary.json
          if-no-files-found: error
          compression-level: 9
      - name: Commit generated evidence manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/Data/mavenNgimsL1bCalibrationArchive/preflight-calibration-products.json
          git add src/modules/Data/mavenNgimsL1bCalibrationArchive/preflight-calibration-housekeeping-summary.json
          if ! git diff --cached --quiet; then
            git commit -m "data(science): index NGIMS preflight calibration evidence [skip ci]"
            git fetch origin stage-3-planetary-physics
            git rebase origin/stage-3-planetary-physics
            git push origin HEAD:stage-3-planetary-physics
          fi
