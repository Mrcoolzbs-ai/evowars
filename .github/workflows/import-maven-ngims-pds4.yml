name: Import MAVEN NGIMS PDS4 TID 14282

on:
  push:
    branches: [stage-3-planetary-physics]

jobs:
  retrieve:
    # One-shot retrieval is explicit in the commit subject. Normal pushes do
    # not re-download or mutate archived source data.
    if: contains(github.event.head_commit.message, '[import-ngims-tid-14282]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout science branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: stage-3-planetary-physics

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download and validate exact PDS4 product bytes
        run: python scripts/science/retrieve-maven-ngims-tid-14282.py

      - name: Commit frozen public archive payload
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/Data/mavenNgimsArchive/
          if git diff --cached --quiet; then
            echo "PDS4 source payload is already frozen at the current version."
          else
            git commit -m "data(science): freeze verified MAVEN NGIMS TID 14282 payload [skip ci]"
            git push origin HEAD:stage-3-planetary-physics
          fi
