name: Inspect official MAVEN NGIMS retrieval form

on:
  push:
    branches: [stage-3-planetary-physics]

jobs:
  inspect:
    if: contains(github.event.head_commit.message, '[inspect-ngims-retrieval-form]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect public PDS form names and values
        run: python scripts/science/inspect-ngims-retrieval-form.py
