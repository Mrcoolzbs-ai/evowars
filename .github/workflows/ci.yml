name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: |
          # Stage 4.1.1.3: страницы логов GitHub Actions требуют входа в
          # аккаунт; при неудаче TypeScript check фактические ошибки tsc
          # публикуются комментарием PR, чтобы быть видимыми без входа
          # (как notice-итоги Vitest ниже).
          set +e
          npx tsc -b 2>&1 | tee tsc-output.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo "tsc -b завершился с кодом $status; вывод:"
            cat tsc-output.log
            if [ -n "$PR_NUMBER" ]; then
              BODY=$(jq -n --rawfile log tsc-output.log '{body: ("TypeScript check (npx tsc -b) не пройден:\n```\n" + ($log | .[0:20000]) + "\n```")}')
              curl -s -X POST \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                -d "$BODY" \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" || echo "не удалось опубликовать комментарий с выводом tsc"
            fi
            exit "$status"
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Tests
        run: |
          set -o pipefail
          npx vitest run 2>&1 | tee vitest-output.log
          # Stage 4.1.1.3: страницы логов GitHub Actions требуют входа в
          # аккаунт; фактические итоги Vitest публикуются также
          # аннотацией notice, чтобы быть видимыми публично.
          SUMMARY="$(grep -E 'Test Files|Tests ' vitest-output.log | head -n 4 | tr '\n' ' ')"
          echo "Vitest totals: ${SUMMARY}"
          echo "::notice title=Vitest totals::${SUMMARY}"
          # Stage 4.2.1 §0.1: фактический golden baseline химии.
          # Тест пишет контрольную строку в golden-baseline.txt
          # (запись файла не зависит от перехвата консоли раннером);
          # notice-аннотация делает хэш видимым без входа в аккаунт.
          GOLDEN="$(grep -h -E 'GOLDEN-BASELINE' golden-baseline.txt vitest-output.log 2>/dev/null | head -n 1 || true)"
          echo "Golden baseline: ${GOLDEN}"
          echo "::notice title=Golden baseline::FOUND=[${GOLDEN}]"

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
