name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc -b

      - name: Tests
        run: |
          set -o pipefail
          npx vitest run 2>&1 | tee vitest-output.log
          # Stage 4.1.1.3: страницы логов GitHub Actions требуют входа в
          # аккаунт; фактические итоги Vitest публикуются также
          # аннотацией notice, чтобы быть видимыми публично.
          SUMMARY="$(grep -E 'Test Files|Tests ' vitest-output.log | head -n 4 | tr '\n' ' ')"
          echo "Vitest totals: ${SUMMARY}"
          echo "::notice title=Vitest totals::${SUMMARY}"
          # Stage 4.2.1 §0.1: фактический golden baseline химии
          # (SHA-256 контрольной траектории) публикуется notice-аннотацией.
          GOLDEN="$(grep -E 'GOLDEN-BASELINE' vitest-output.log | head -n 1)"
          echo "Golden baseline: ${GOLDEN}"
          echo "::notice title=Golden baseline::${GOLDEN}"

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
